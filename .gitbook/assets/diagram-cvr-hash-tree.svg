    .start { text-anchor: start; }
    .halo { stroke: #fff; stroke-width: 24px; stroke-linejoin: round; paint-order: stroke; }
    .box { fill: #fff; stroke: #1e1e1e; stroke-width: 2; }
    .value { fill: #fff1ac; }
    .group { fill: none; stroke: #ccc; stroke-width: 3; stroke-dasharray: 14 8; }
    .line { fill: none; stroke: #1e1e1e; stroke-width: 4; stroke-linecap: round; }
  </style>
