# Keeps the screenshots these pages use in step with the screenshot gallery
# (votingworks/vxsuite-screenshots). Pages reference a screenshot by its ID,
# as .gitbook/assets/<id>.png; the gallery's sync tool adds a referenced
# screenshot that is missing and replaces one that differs from the published
# copy. The gallery republishes a screen only when it visibly changes, so the
# copies here stay identical between real changes. Photos and other images
# the gallery does not generate are never touched.
#
# - On a pull request: syncs the screenshots referenced by the pages it
#   changes, committing to its branch.
# - Run by hand with a branch: syncs that branch as for a pull request (for
#   a screenshot published after the branch's last push).
#
# A docs-request branch can hold previews: screenshots an open spec rendered,
# copied in by the docs bot (votingworks/vxsuite-docs-automation) before the
# gallery publishes them, and listed in .screenshot-previews.json. The sync
# leaves them alone.
#
# While .screenshot-previews.json exists (the docs bot adds it, possibly
# empty, to every docs-request branch), the branch is in review: each
# screenshot its changed pages use that differs from main's copy is kept at
# <id>.review.png, with those pages pointing there and <id>.png left as on
# main, so GitBook's diff shows the old screen beside the new one (it draws
# an image by filename, so a screenshot changed in place shows the new one
# on both sides). The gallery's review-names.mjs moves them; every other tool
# reads <id>.png, so the sync runs between `un` and `re`. This check fails
# while the branch is in review or any review copy remains: the docs bot
# swaps in the published screenshots, puts the stable names back and deletes
# the list before it merges, so main only ever has <id>.png.
#
# The manual refresh of every page (or chosen IDs) is screenshots-refresh.yml, kept separate
# so pull requests list only this job. A sync commit is pushed with
# [skip ci] (a push by this workflow's token starts no run anyway) and is
# marked passing here, so the required "branch" check is on every head.
name: screenshots
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to sync as a pull request
        required: true

env:
  TOOLS_URL: https://vxsuite-integration-test-screenshots.s3.us-west-2.amazonaws.com/tools

jobs:
  branch:
    name: Screenshots are up-to-date
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'screenshots/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
      - name: Sync the screenshots the changed pages reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          for f in sync-docs-screenshots.mjs png-diff.mjs review-names.mjs; do
            curl -fsS "$TOOLS_URL/$f" -o "$RUNNER_TEMP/tools/$f"
          done
          node "$RUNNER_TEMP/tools/review-names.mjs" . un
          git diff --name-only origin/main...HEAD -- '*.md' > "$RUNNER_TEMP/pages.txt"
          in_review=false
          [ -f .screenshot-previews.json ] && in_review=true
          if [ ! -s "$RUNNER_TEMP/pages.txt" ] && [ "$in_review" != true ]; then
            echo "no pages changed"; exit 0
          fi
          node "$RUNNER_TEMP/tools/sync-docs-screenshots.mjs" . \
            --pages "$RUNNER_TEMP/pages.txt" --report "$RUNNER_TEMP/report.md"
          if [ "$in_review" = true ]; then
            node "$RUNNER_TEMP/tools/review-names.mjs" . re --pages "$RUNNER_TEMP/pages.txt"
          fi

          # Previews the docs bot copied in, listed so the check can fail on them.
          previews=""
          if [ -f .screenshot-previews.json ]; then
            previews="$(python3 -I - <<'PY'
          import json
          for capture_id, record in sorted(json.load(open(".screenshot-previews.json")).items()):
              print(f"- `{capture_id}` from {record.get('spec', 'an open spec')}")
          PY
          )"
          fi

          # The sync skips a name the gallery doesn't publish (it may be a
          # photo), so a page can point at an image that exists nowhere: a
          # screenshot not yet published, or a typo. Fail on those.
          missing="$(python3 -I - "$RUNNER_TEMP/pages.txt" <<'PY'
          import re, sys, urllib.parse
          from pathlib import Path
          ref = re.compile(r"\.gitbook/assets/[^\"<>\n]+?\.(?:png|jpe?g|gif|svg|webp|pdf)", re.I)
          for page in Path(sys.argv[1]).read_text().splitlines():
              if not Path(page).is_file():
                  continue
              for found in sorted(set(ref.findall(Path(page).read_text()))):
                  path = urllib.parse.unquote(found)
                  if not Path(path).is_file():
                      print(f"- `{path}` on `{page}`")
          PY
          )"

          if [ -n "$(git status --porcelain -- .gitbook/assets '*.md')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- .gitbook/assets '*.md'
            git commit -q -m "Sync screenshots from the gallery [skip ci]" -m "$(cat "$RUNNER_TEMP/report.md")"
            git push -q origin HEAD
            if [ -n "$missing" ]; then state=failure desc="Pages reference images that don't exist"
            elif [ -n "$previews" ]; then state=failure desc="Previews in place; the published screenshots aren't swapped in yet"
            elif [ "$in_review" = true ]; then state=failure desc="In review; the docs bot restores screenshot names before merging"
            else state=success desc="Screenshots synced from the gallery"; fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
              -f state="$state" -f context="Screenshots are up-to-date" \
              -f description="$desc" --silent
          fi
          if [ -n "$previews" ]; then
            printf 'These screenshots are previews from open screenshot specs. The docs bot swaps in the published copies when the docs request is approved, before it merges:\n%s\n\n' "$previews" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$in_review" = true ]; then
            reviewed="$(find .gitbook/assets -maxdepth 1 -name '*.review.png' -printf '- `%f`\n' 2>/dev/null | sed 's/\.review\.png`$/`/' | sort || true)"
            printf 'In review (.screenshot-previews.json is present). Changed screenshots are under review names so the GitBook diff shows old beside new; the docs bot restores the stable names when the request is approved, before it merges:\n%s\n\n' "${reviewed:-(none changed)}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$missing" ]; then
            printf 'Pages reference images that are neither in the repository nor published in the gallery:\n%s\n' "$missing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$missing" ] || [ -n "$previews" ] || [ "$in_review" = true ]; then exit 1; fi
