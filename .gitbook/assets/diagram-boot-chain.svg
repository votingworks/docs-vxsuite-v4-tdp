<svg xmlns="http://www.w3.org/2000/svg" width="2668.5" height="1401" viewBox="-3 -48 2668.5 1401">
  <!--
    Boot chain diagram, TDP
    system-security-auditing-and-logging/system-security-architecture/system-integrity.md.
    Edit this file directly: every label is text. Text is set in Inter,
    falling back to the reader's sans-serif (GitBook strips embedded fonts).
    Redrawn from "Screenshot 2023-06-30 at 9.55.02 AM.png"; this file now
    replaces it as the source.

    Dotted lines show what each PCR measures; the dotted boxes are their
    labels, drawn over unbroken lines.
  -->
  <style>
    text { font-family: "Inter", sans-serif; font-size: 34px; font-weight: 400; letter-spacing: -0.4px; fill: #1e1e1e; text-anchor: middle; dominant-baseline: central; }
    .b { font-weight: 700; }
    .small { font-size: 25px; }
    .smaller { font-size: 22px; }
    .title { font-size: 48px; font-weight: 700; }
    .code { font-family: "Courier New", Courier, monospace; font-size: 25px; letter-spacing: 0; fill: #555; text-anchor: start; }
    .code .b { fill: #1e1e1e; }
    .halo { stroke: #fff; stroke-width: 24px; stroke-linejoin: round; paint-order: stroke; }
    .box { fill: #d3e1f1; stroke: #1e1e1e; stroke-width: 4; }
    .plain { fill: #fff; stroke: #1e1e1e; stroke-width: 4; }
    .note { fill: #fff; stroke: #1e1e1e; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
    .line { fill: none; stroke: #1e1e1e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .measures { stroke-width: 3; stroke-dasharray: 2 8; }
  </style>
  <defs>
    <marker id="head" viewBox="-20 -10 22 20" refX="0" refY="0" markerWidth="22" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L-20 -9 L-20 9 Z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <rect x="-3" y="-48" width="2668.5" height="1401" fill="#fff"/>

  <!-- Boot sequence -->
  <path class="line" marker-end="url(#head)" d="M617.5 122.5 H840"/>
  <path class="line" marker-end="url(#head)" d="M1257.5 122.5 H1765 Q1790 122.5 1790 147.5 V210"/>
  <path class="line" marker-end="url(#head)" d="M1790 450 V696.2"/>
  <path class="line" marker-end="url(#head)" d="M1790 872.5 V1143.8 Q1790 1168.8 1765 1168.8 H1690"/>
  <path class="line" d="M1220 1168.8 H781.2"/>

  <!-- PCR measurements into the TPM -->
  <path class="line measures" marker-end="url(#head)" d="M137.5 202.5 L378.8 425"/>
  <path class="line measures" marker-end="url(#head)" d="M356.2 202.5 L532.5 425"/>
  <path class="line measures" marker-end="url(#head)" d="M1047.5 210 L642.5 425"/>

  <!-- TPM -->
  <rect class="box" x="206.2" y="433.8" width="657.5" height="425" rx="0"/>
  <rect class="plain" x="226.2" y="452.5" width="617.5" height="386.2" rx="0"/>

  <!-- Application signing: request to the TPM and the key it returns -->
  <path class="line" marker-end="url(#head)" d="M500 1067.5 C465 1027.5 425 950 450 875 C460 837.5 475 806.2 496.2 790"/>
  <path class="line" marker-end="url(#head)" d="M575 790 C612.5 806.2 631.2 850 622.5 912.5 C617.5 962.5 568.8 1000 552.5 1060"/>

  <!-- Steps -->
  <rect class="box" x="85" y="47.5" width="532.5" height="152.5" rx="27.5"/>
  <text x="351.2" y="77.5">UEFI <tspan class="b">secure boot</tspan></text>
  <text x="351.2" y="123.8">uses Vx public keys</text>
  <text x="351.2" y="170">to check signature on …</text>
  <rect class="box" x="850" y="40" width="407.5" height="167.5" rx="27.5"/>
  <text x="1053.8" y="77.5">… <tspan class="b">signed</tspan></text>
  <text x="1053.8" y="123.8">Kernel+Bootloader+</text>
  <text x="1053.8" y="170">command line …</text>
  <rect class="box" x="1312.5" y="220" width="955" height="87.5" rx="0"/>
  <text x="1790" y="263.8">… command line invokes <tspan class="b">dm-verity</tspan> with <tspan class="b">root hash</tspan></text>
  <rect class="plain" x="1000" y="307.5" width="1577.5" height="142.5" rx="0"/>
  <text class="code" x="1017.5" y="345">BOOT_IMAGE=/vmlinuz-5.10.0-11-amd64 root=/dev/mapper/vroot ro quiet vt.handoff=7 fsck.mode=skip</text>
  <text class="code" x="1017.5" y="380">verity.hashdev=/dev/mapper/Vx--vg-hashes verity.rootdev=/dev/mapper/Vx--vg-root</text>
  <text class="code" x="1017.5" y="415">verity.hash=<tspan class="b">&lt;ROOT_HASH&gt;</tspan></text>
  <rect class="box" x="1585" y="706.2" width="407.5" height="166.2" rx="27.5"/>
  <text x="1788.8" y="746.2">… <tspan class="b">dm-verity</tspan></text>
  <text x="1788.8" y="792.5">verifies <tspan class="b">hard drive</tspan></text>
  <text x="1788.8" y="838.8">against <tspan class="b">root hash</tspan></text>
  <rect class="box" x="1220" y="1070" width="460" height="195" rx="35"/>
  <text x="1450" y="1145">Linux boots and</text>
  <text x="1450" y="1191.2"><tspan class="b">application code</tspan> runs</text>
  <rect class="box" x="323.8" y="1070" width="457.5" height="195" rx="35"/>
  <text x="552.5" y="1145">Application code</text>
  <text x="552.5" y="1191.2"><tspan class="b">signs</tspan> a payload</text>
  <text class="title" x="535" y="578.8">TPM</text>
  <text x="535" y="633.8">unseals application signing key</text>
  <text x="535" y="677.5">only if PCRs match (secure boot</text>
  <text x="535" y="721.2">keys, BIOS, command line)</text>
  <text x="535" y="787.5">✅</text>

  <!-- Labels: dotted boxes drawn over their lines -->
  <rect class="note" x="147.5" y="261.2" width="175" height="97.5" rx="0"/>
  <text class="smaller" x="235" y="295">Secure boot</text>
  <text class="smaller" x="235" y="323.8">keys hash</text>
  <rect class="note" x="382.5" y="278.8" width="177.5" height="75" rx="0"/>
  <text class="small" x="471.2" y="316.2">BIOS hash</text>
  <rect class="note" x="686.2" y="265" width="272.5" height="142.5" rx="0"/>
  <text class="small" x="822.5" y="302.5">Hash of</text>
  <text class="small" x="822.5" y="336.2">kernel+bootloader</text>
  <text class="small" x="822.5" y="370">+cmdline</text>
  <rect class="note" x="351.2" y="910" width="336.2" height="108.8" rx="0"/>
  <text class="small" x="518.8" y="947.5">Request for application</text>
  <text class="small" x="518.8" y="981.2">signing key from TPM</text>
</svg>
