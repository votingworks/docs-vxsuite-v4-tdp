<svg xmlns="http://www.w3.org/2000/svg" width="3792" height="1776" viewBox="0 0 3792 1776">
  <!--
    Top-level system diagram (TDP home page). Edit this file directly: labels
    are text, centered on their connector with a white halo, so renaming one
    needs no other change. Text is set in Inter, falling back to the
    reader's sans-serif (GitBook strips embedded fonts). Drawn from Figma's "TDP Diagrams" board,
    section 6024:534, which this file now replaces as the source.
  -->
  <style>
    text { font-family: "Inter", sans-serif; font-size: 40px; font-weight: 500; letter-spacing: -0.88px; fill: #000; fill-opacity: 0.8; text-anchor: middle; }
    .label { stroke: #fff; stroke-width: 40px; stroke-linejoin: round; paint-order: stroke; stroke-opacity: 1; }
    .title { font-weight: 700; fill: #1e1e1e; fill-opacity: 1; text-anchor: start; }
    .box { fill: #fff; stroke: #1e1e1e; stroke-width: 4; }
    .line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .data { stroke: #14ae5c; }
    .ballots { stroke: #0d99ff; }
    .results { stroke: #9747ff; }
  </style>
  <defs>
    <marker id="arrow-data" viewBox="0 0 18 32" refX="16" refY="16" markerWidth="18" markerHeight="32" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L16 16 L2 30" fill="none" stroke="#14ae5c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-ballots" viewBox="0 0 18 32" refX="16" refY="16" markerWidth="18" markerHeight="32" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L16 16 L2 30" fill="none" stroke="#0d99ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-results" viewBox="0 0 18 32" refX="16" refY="16" markerWidth="18" markerHeight="32" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L16 16 L2 30" fill="none" stroke="#9747ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="39" y="39" width="3714" height="1698" rx="12" fill="#fff" stroke="#e6e6e6" stroke-width="2"/>

  <!-- VxSuite boundary -->
  <rect x="1160" y="88" width="2544" height="1296" rx="6" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round" stroke-dasharray="16.13 10.04"/>
  <text class="title" x="1206" y="168">VxSuite</text>

  <!-- Connectors: green carries election data, blue ballots, purple results -->
  <path class="line data" marker-end="url(#arrow-data)" d="M464 784 V1083 A24 24 0 0 0 488 1107 H1361"/>
  <path class="line data" marker-end="url(#arrow-data)" d="M464 608 V287 A24 24 0 0 1 488 263 H545"/>
  <path class="line data" marker-end="url(#arrow-data)" d="M1728 1107 H2993"/>
  <path class="line data" marker-end="url(#arrow-data)" d="M2080 1107 V640 A24 24 0 0 1 2104 616 H2433"/>
  <path class="line data" marker-end="url(#arrow-data)" d="M1544 1019 V447 A24 24 0 0 1 1568 423 H1809"/>
  <path class="line ballots" marker-end="url(#arrow-ballots)" d="M1120 263 H3375 A24 24 0 0 1 3399 287 V1020"/>
  <path class="line ballots" marker-end="url(#arrow-ballots)" d="M2176 423 H3304 A24 24 0 0 1 3328 447 V1020"/>
  <path class="line ballots" marker-end="url(#arrow-ballots)" d="M2720 704 V839 A22.5 22.5 0 0 0 2742.5 861.5 H3230.75 A22.5 22.5 0 0 1 3253.25 884 V1020"/>
  <path class="line results" marker-end="url(#arrow-results)" d="M3328 1195 V1280 A24 24 0 0 1 3304 1304 H1634.8 A24 24 0 0 1 1610.8 1280 V1194"/>
  <path class="line results" marker-end="url(#arrow-results)" d="M1481.2 1195 V1673"/>
  <path class="line results" marker-end="url(#arrow-results)" d="M3379.8 1195 V1689"/>

  <!-- Connector labels -->
  <text class="label" x="851.2" y="1121.5">Election Package (USB Drive)</text>
  <text class="label" x="464" y="450">Bubble Ballot PDFs</text>
  <text class="label" x="2159.9" y="1121.5">Configuration Package (USB Drive)</text>
  <text class="label" x="1544" y="739">Configuration Package (USB Drive)</text>
  <text class="label" x="2259.5" y="277.5">Hand-marked Bubble Ballots</text>
  <text class="label" x="2752" y="437.5">Hand-marked Bubble Ballots</text>
  <text class="label" x="2986.6" y="876">Machine-marked Ballots</text>
  <text class="label" x="2469.4" y="1318.5">Cast Vote Records</text>
  <text class="label" x="1481.2" y="1448">Results Exports</text>
  <text class="label" x="3379.8" y="1456">Poll Reports</text>

  <!-- Systems -->
  <rect class="box" x="88" y="616" width="752" height="160" rx="64"/>
  <text x="464" y="710.5">External Election Definition System</text>
  <rect class="box" x="552" y="183" width="560" height="160" rx="64"/>
  <text x="832" y="277.5">Third Party Printer</text>
  <rect class="box" x="1368" y="1027" width="352" height="160" rx="64"/>
  <text x="1544" y="1121.5">VxAdmin</text>
  <rect class="box" x="1816" y="343" width="352" height="160" rx="64"/>
  <text x="1992" y="437.5">VxPrint</text>
  <rect class="box" x="2440" y="536" width="560" height="160" rx="64"/>
  <text x="2720" y="630.5">VxMark or VxMarkScan</text>
  <rect class="box" x="3000" y="1027" width="656" height="160" rx="64"/>
  <text x="3328" y="1121.5">VxScan or VxCentralScan</text>
</svg>
